[project]
name = "antiphon"
version = "0.0.0"
description = "A personal last.fm recommendation companion"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]
